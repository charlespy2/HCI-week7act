<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Saguid HTML Form Activity</title>
</head>
<body>
    <h1>HTML Form</h1>
    <form action="">
        <fieldset>
            <legend>Personal Information</legend>
        <p>Enter Your Name:</p> 
        <label for="name">Name:</label>
        <input type="text" name="name" id="name"><br><br>

        <p>Enter Your Gmail</p>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email"><br><br>
        <input type="submit"> <br><br>

        </fieldset>

        <fieldset>
            <legend>Gender</legend>
            <p>Choose Your Gender</p>
        <input type="radio" name="gender" id="gender" value="male">
        <label for="gender">Male</label><br><br>

        <input type="radio" name="gender" id="gender" value="female">
        <label for="gender">Female</label><br><br>        
     
        <input type="radio" name="gender" id="gender" value="others">
        <label for="gender">Others</label><br><br>          

        <input type="submit"><br><br>
        </fieldset>    

        <fieldset>
            <legend>Hobbies</legend>
            <p>Pick Your Hobbies:</p>
        <input type="checkbox" name="hobbies" id="hobbies" value="reading">
        <label for="hobbies">Reading</label><br><br>

        <input type="checkbox" name="hobbies" id="hobbies" value="Martial Arts">
        <label for="hobbies">Martial Arts</label><br><br>

        <input type="checkbox" name="hobbies" id="hobbies" value="Video Games">
        <label for="hobbies">Video Games</label><br><br>

        <input type="checkbox" name="hobbies" id="hobbies" value="Writing">
        <label for="hobbies">Writing</label><br><br>

        <input type="submit"><br><br>
         </fieldset>
            

        <label for="user-comment">Additional Comments</label><br><br>
        <textarea id="user-comment" name="comment" rows="5" cols="40"></textarea><br><br>
        <input type="submit">
    </form>
</body>
</html>
